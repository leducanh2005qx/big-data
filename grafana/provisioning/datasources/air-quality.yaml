apiVersion: 1

datasources:
  - name: Air Quality InfluxDB
    uid: air-quality-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: $INFLUXDB_DATABASE
    user: $INFLUXDB_ADMIN_USER
    basicAuth: false
    isDefault: true
    editable: false
    jsonData:
      version: InfluxQL
      httpMode: GET
      timeInterval: 1m
    secureJsonData:
      password: $INFLUXDB_ADMIN_PASSWORD
