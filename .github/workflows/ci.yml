name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q producer spark_jobs scripts tests
      - name: Run offline tests
        run: python -m pytest -q
      - name: Validate JSON and YAML provisioning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path("schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("grafana").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          json.loads(Path("grafana/dashboards/air-quality-overview.json").read_text(encoding="utf-8"))
          PY
      - name: Validate Compose file
        run: docker compose config
      - name: Build application image
        run: docker build -t airquality-pipeline:ci .
